# Activated with -Dspring-boot.run.profiles=local (or SPRING_PROFILES_ACTIVE=local).
# Everything here is noise you want while developing and never want in production.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
