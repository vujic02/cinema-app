name: backend-ci

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # Testcontainers hangs are silent. Without this a stuck run burns 6h of minutes.
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          # Caches ~/.m2 keyed on pom.xml. First run slow, rest ~30s faster.
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          # NOTE: repo-root relative — upload-artifact ignores defaults.working-directory.
          path: backend/target/surefire-reports/
